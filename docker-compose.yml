services:
  # 1. Base de Datos: PostgreSQL 17
  db:
    image: postgres:17-alpine
    container_name: carga_lectiva_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # 2. Backend: FastAPI (Python)
  backend:
    build: 
      context: ./backend
    container_name: carga_lectiva_backend

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app  
    depends_on:
      - db
    env_file:
      - .env

  # 3. Frontend: React + Vite
  frontend:
    build: 
      context: ./frontend
    container_name: carga_lectiva_frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules 
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  pgdata: # Almacenamiento persistente 
